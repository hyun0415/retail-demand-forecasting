model = "catboost"
forecast_horizons = [1, 2, 3, 4, 5, 6, 7]
training_origin_days = 365
validation_days = 28
lags = [1, 7, 14, 28, 56]
rolling_windows = [7, 14, 28]
random_state = 42

[paths]
raw = "data/raw"
processed = "data/processed"
model = "models"
output = "outputs"

[catboost]
loss_function = "MAE"
iterations = 1200
learning_rate = 0.04
depth = 8
l2_leaf_reg = 5.0
task_type = "GPU"
devices = "0"
gpu_ram_part = 0.8
allow_writing_files = false
verbose = 50
