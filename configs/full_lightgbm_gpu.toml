model = "lightgbm"
forecast_horizons = [1, 2, 3, 4, 5, 6, 7]
training_origin_days = 0
validation_days = 28
lags = [1, 7, 14, 28, 56]
rolling_windows = [7, 14, 28]
random_state = 42
excluded_features = ["is_event", "is_earthquake"]

[paths]
raw = "data/raw"
processed = "data/processed"
model = "models/full_history_l2"
output = "outputs/full_history_l2"

[lightgbm]
objective = "regression"
n_estimators = 1200
learning_rate = 0.04
num_leaves = 63
max_depth = -1
min_child_samples = 40
subsample = 0.8
colsample_bytree = 0.8
reg_alpha = 0.1
reg_lambda = 0.2
n_jobs = -1
verbosity = -1
device_type = "gpu"
