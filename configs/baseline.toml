model = "lightgbm"
forecast_horizon = 7
validation_days = 28
lags = [1, 7, 14, 28, 56]
rolling_windows = [7, 14, 28]
random_state = 42

[paths]
raw = "data/raw"
model = "models"
output = "outputs"

[lightgbm]
objective = "regression_l1"
n_estimators = 1200
learning_rate = 0.04
num_leaves = 63
max_depth = -1
min_child_samples = 40
subsample = 0.8
colsample_bytree = 0.8
reg_alpha = 0.1
reg_lambda = 0.2
n_jobs = -1

[catboost]
loss_function = "MAE"
iterations = 1200
learning_rate = 0.04
depth = 8
l2_leaf_reg = 5.0
allow_writing_files = false
verbose = false

